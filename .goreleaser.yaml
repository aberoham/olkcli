version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: olk-darwin
    main: ./cmd/olk
    binary: olk
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/rlrghb/olkcli/internal/cmd.Version={{.Version}}
      - -X github.com/rlrghb/olkcli/internal/cmd.Commit={{.Commit}}
      - -X github.com/rlrghb/olkcli/internal/cmd.Date={{.Date}}

archives:
  - name_template: "olk_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./prebuilt-archives/*

release:
  # Tags such as v1.14.1-alpha.1 are marked as GitHub prereleases.
  prerelease: auto
  extra_files:
    - glob: ./prebuilt-archives/*

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - repository:
      owner: rlrghb
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # Only upstream publishes this cask. A fork's own tap reads its releases
    # and writes its cask itself, so a fork holds no tap credential.
    skip_upload: '{{ if eq (envOrDefault "GITHUB_REPOSITORY" "") "rlrghb/olkcli" }}false{{ else }}true{{ end }}'
    name: olk
    binaries:
      - olk
    homepage: https://github.com/rlrghb/olkcli
    description: CLI for Microsoft Outlook via Microsoft Graph API
    license: MIT
    # The macOS binary is unsigned, so Homebrew's cask quarantine makes
    # Gatekeeper SIGKILL it on first run ("killed: 9"). Strip the quarantine
    # flag on install. This is the goreleaser-documented pattern for unsigned
    # casks (cf. gibo, GraalVM, Stream CLI). Remove once the build is
    # Developer ID-signed + notarized.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/olk"]
          end
