version: "2"
linters:
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errname
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - misspell
    - nakedret
    - nilerr
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    goconst:
      # goconst 1.10 (golangci-lint 2.12) began reporting strings inside
      # composite literals, and setting exclude-types replaces the default
      # that skipped call arguments. Here those literals are $select field
      # lists, MCP command paths, table headers and error formats, which read
      # best spelled out; both are excluded to keep the earlier scope.
      exclude-types:
        - CompositeLit
        - Call
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: unexported-return
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rlrghb/olkcli
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
