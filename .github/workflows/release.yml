name: Release

on:
  push:
    tags:
      - "v*"
  # mirror-upstream.yml calls this to build an upstream release.
  workflow_call:
    inputs:
      source_repository:
        description: Repository whose source is built, rlrghb/olkcli
        type: string
        required: true
      source_ref:
        description: Commit to build, the one upstream tagged
        type: string
        required: true
      release_tag:
        description: Tag of the release this run creates, upstream-vX.Y.Z
        type: string
        required: true
      version_tag:
        description: Upstream's tag, vX.Y.Z, which names the archives
        type: string
        required: true

# A tag push builds the tagged commit and releases it under that tag. A call
# from mirror-upstream.yml builds upstream's tagged commit, checked out from
# upstream's repository, with this commit's GoReleaser configs, and releases
# it here under an upstream- tag. That tag goes on this workflow's commit, not
# upstream's; the attested source manifest records which upstream commit was
# built.
env:
  SOURCE_REPOSITORY: ${{ inputs.source_repository || github.repository }}
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}
  MIRROR: ${{ inputs.release_tag && 'true' || 'false' }}

permissions:
  contents: read

# Never cancel a release half way. A second run for the same tag waits.
concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  # A fork publishes its own work only as vX.Y.Z-alpha.N, -beta.N or -rc.N: a
  # plain tag would sort as upstream's stable release of the same number.
  # Upstream's stable releases are mirrored as upstream-vX.Y.Z instead, only
  # from next, only from upstream's repository, and only for the exact commit
  # upstream tagged.
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check tag form
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ github.repository == 'rlrghb/olkcli' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MIRROR" == true ]]; then
            if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "upstream-${VERSION_TAG}" ]]; then
              echo "A mirror publishes upstream-vX.Y.Z for upstream's vX.Y.Z; got ${RELEASE_TAG} for ${VERSION_TAG}" >&2
              exit 1
            fi
            if [[ "$GITHUB_REF" != refs/heads/next || "$SOURCE_REPOSITORY" != rlrghb/olkcli ]]; then
              echo "A mirror runs only from next and builds only rlrghb/olkcli; got ${GITHUB_REF} building ${SOURCE_REPOSITORY}" >&2
              exit 1
            fi
            tagged="$(gh api "repos/${SOURCE_REPOSITORY}/commits/${VERSION_TAG}" --jq .sha)"
            if [[ "$tagged" != "$SOURCE_REF" ]]; then
              echo "Upstream ${VERSION_TAG} is ${tagged}, not ${SOURCE_REF}" >&2
              exit 1
            fi
          elif [[ "$UPSTREAM" != true && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Forks publish only vX.Y.Z-alpha.N, -beta.N or -rc.N; got ${RELEASE_TAG}" >&2
            exit 1
          fi

  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      repository: ${{ inputs.source_repository }}
      ref: ${{ inputs.source_ref }}

  # Both build jobs check out the source to build under src/ and this commit,
  # for its GoReleaser configs, under fork/. For a tag push they are the same
  # commit. GORELEASER_CURRENT_TAG names the version, since upstream can put
  # two tags on one commit.
  pre-build:
    needs: [verify-tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this workflow's commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: fork
          persist-credentials: false

      - name: Checkout the source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Build linux and windows archives
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "v2.18.2"
          workdir: src
          args: release --config ../fork/.goreleaser-prebuild.yaml --clean --timeout 30m
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ env.VERSION_TAG }}

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-archives
          path: |
            src/dist/*.tar.gz
            src/dist/*.zip
          retention-days: 1

  build-macos:
    # Build dependencies and CGO code never share a runner with signing keys.
    runs-on: macos-latest
    needs: pre-build
    timeout-minutes: 40
    steps:
      - name: Checkout this workflow's commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: fork
          persist-credentials: false
      - name: Checkout the source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: src/go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuilt-archives
          path: src/prebuilt-archives/
      - name: Build without publishing
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "v2.18.2"
          workdir: src
          args: release --config ../fork/.goreleaser.yaml --clean --skip=publish --timeout 35m
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ env.VERSION_TAG }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-macos
          path: src/dist/olk_*_darwin_*.tar.gz
          if-no-files-found: error
          retention-days: 1

  sign-macos:
    runs-on: macos-latest
    needs: build-macos
    # Defense in depth; the environment reviewer and tag ruleset are the boundary.
    if: github.repository_owner_id == 586805 && github.actor == 'aberoham' && github.triggering_actor == 'aberoham'
    environment: release
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-macos
          path: unsigned/
      - name: Prepare signing identity
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: python3 .github/scripts/macos-signing.py prepare
      - name: Sign and notarize macOS archives
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir signed
          for arch in amd64 arm64; do
            archive="olk_${VERSION_TAG#v}_darwin_${arch}.tar.gz"
            unpacked="${RUNNER_TEMP}/olk-${arch}"
            mkdir "$unpacked"
            tar xzf "unsigned/$archive" -C "$unpacked"
            test -f "$unpacked/olk"
            test ! -L "$unpacked/olk"
            python3 .github/scripts/macos-signing.py sign "$unpacked/olk" com.aberoham.olk --notarize
            # Keep root member names (olk, not ./olk) for existing consumers.
            shopt -s dotglob nullglob
            members=( "$unpacked"/* )
            members=( "${members[@]##*/}" )
            tar czf "signed/$archive" -C "$unpacked" -- "${members[@]}"
          done
      - name: Remove signing credentials
        if: always()
        run: python3 .github/scripts/macos-signing.py cleanup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-macos
          path: signed/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    # Publishing has a write token but never receives Apple credentials.
    runs-on: ubuntu-latest
    needs: [pre-build, sign-macos]
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation through Sigstore
      attestations: write # store the attestation against the repository
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuilt-archives
          path: release/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-macos
          path: release/

      # The provenance attestation names this workflow's repository and
      # commit, which for a mirror are the fork's, not upstream's. The source
      # manifest records what was built, and is attested with the archives.
      - name: Write the source manifest
        if: env.MIRROR == 'true'
        shell: bash
        run: |
          set -euo pipefail
          manifest="release/olk_${VERSION_TAG#v}_source.txt"
          {
            echo "source_repository=${SOURCE_REPOSITORY}"
            echo "source_tag=${VERSION_TAG}"
            echo "source_commit=${SOURCE_REF}"
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$manifest"
          cat "$manifest"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -- olk_* > checksums.txt
          cat checksums.txt

      # Attests every file as published, after the macOS ones were signed,
      # so `gh attestation verify` ties each download to this workflow run.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/checksums.txt

      # A mirror creates its upstream- tag on this workflow's commit, refusing
      # one that already exists, and points at upstream's notes. A tag push's
      # tag already exists.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          if [[ "$MIRROR" != true ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --generate-notes -- ./*
            exit 0
          fi
          if out="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>&1)"; then
            echo "${RELEASE_TAG} already exists here; delete it or its release before mirroring again" >&2
            exit 1
          elif ! grep -q 'HTTP 404' <<<"$out"; then
            echo "Could not check for ${RELEASE_TAG}: ${out}" >&2
            exit 1
          fi
          notes="Signed, notarized and attested build of [${SOURCE_REPOSITORY} ${VERSION_TAG}](https://github.com/${SOURCE_REPOSITORY}/releases/tag/${VERSION_TAG}), commit ${SOURCE_REF}. The tag marks the fork workflow commit that built it; olk_${VERSION_TAG#v}_source.txt, attested with the archives, records the source."
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "$notes" -- ./*

  # Publish the `olk` CLI to npm (esbuild-style binary wrapper) so it is
  # installable via npx/npm and listable on the MCP Registry. Publishes via
  # npm Trusted Publishing (OIDC) — no stored token: each package
  # (olkcli + the six olk-<platform> packages) has a trusted publisher
  # configured for this repo + workflow, and npm mints a short-lived
  # credential per run from the GitHub OIDC identity. Gated on the
  # PUBLISH_NPM repo variable.
  npm-publish:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ vars.PUBLISH_NPM == 'true' && !inputs.release_tag }}
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC token for npm Trusted Publishing
      contents: read # checkout + gh release download
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (Trusted Publishing/OIDC requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Extract release binaries into per-platform packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p rel tmpx
          gh release download "$GITHUB_REF_NAME" -p "olk_${VERSION}_*" -D rel
          extract() { # archive dest exe
            mkdir -p "$(dirname "$2")"
            if [[ "$1" == *.zip ]]; then unzip -o "$1" "$3" -d tmpx; else tar -xzf "$1" -C tmpx "$3"; fi
            mv "tmpx/$3" "$2"
          }
          extract "rel/olk_${VERSION}_darwin_amd64.tar.gz"  npm/olk-darwin-x64/bin/olk      olk
          extract "rel/olk_${VERSION}_darwin_arm64.tar.gz"  npm/olk-darwin-arm64/bin/olk    olk
          extract "rel/olk_${VERSION}_linux_amd64.tar.gz"   npm/olk-linux-x64/bin/olk       olk
          extract "rel/olk_${VERSION}_linux_arm64.tar.gz"   npm/olk-linux-arm64/bin/olk     olk
          extract "rel/olk_${VERSION}_windows_amd64.zip"    npm/olk-win32-x64/bin/olk.exe   olk.exe
          extract "rel/olk_${VERSION}_windows_arm64.zip"    npm/olk-win32-arm64/bin/olk.exe olk.exe
          chmod +x npm/olk-*/bin/olk

      - name: Stamp versions and publish to npm
        run: node scripts/build-npm.mjs "${GITHUB_REF_NAME}" --publish

  # Publish the server.json to the official MCP Registry. Runs after the npm
  # package is live (the registry validates it). Uses GitHub OIDC — no secret.
  registry-publish:
    runs-on: ubuntu-latest
    needs: npm-publish
    if: ${{ vars.PUBLISH_NPM == 'true' && !inputs.release_tag }}
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Stamp server.json version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version=$v | .packages[0].version=$v' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          set -euo pipefail
          max_attempts=6

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            set +e
            output=$(./mcp-publisher publish 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"

            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi

            # npm can publish successfully before the registry's package
            # validation replica can see the new version. Retry that
            # transient 404, but fail immediately for other errors.
            if ! grep -qE 'NPM package .* was not found|status: 404' <<<"$output"; then
              exit "$status"
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              exit "$status"
            fi

            delay=$((15 << (attempt - 1)))
            echo "npm propagation is still pending; retrying in ${delay}s (attempt ${attempt}/${max_attempts})"
            sleep "$delay"
          done
